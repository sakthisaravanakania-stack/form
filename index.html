<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>


    <h1>Student Registration Form</h1>
    <p>Fill in the details below ans submit</p>

    <form id="studentForm" action="">

        <label>First Name:</label>
        <input type="text" id="firstname" placeholder="Enter First Name" required>

        <label>Last Name:</label>
        <input type="text" id="lastname" placeholder="Enter Last Name" required><br>

        <label>Email:</label><br>
        <input type="email" id="email" placeholder="Enter Email"  required><br>

        <label>Address:</label><br>
        <textarea type = "text" id="message" placeholder="Enter Address"  required></textarea><br>

        <label>Pincode:</label>
        <input type="text" id="pincode" placeholder="Enter Pincode" required>

        <label>State:</label>
        <input type="text" id="state" placeholder="Enter State" required><br>

        <label>Country:</label><br>
        <input type="text" id="country" placeholder="Enter country"  required><br>

        <label>Gender:</label><br>

        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other">
        <label for="other">Other</label><br>

        <button type="submit">Submit</button><br>

        <h2>Registered Students:-</h2>

        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>Firstname</th>
                    <th>Lastname</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Pincode</th>
                    <th>Gender</th>
                    <th>State</th>
                    <th>Country</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </form>
    <script src="./script.js"></script>
</body>
</html>
